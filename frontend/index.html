<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama + Gemma3 CoD Chat</title>
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">
  <header class="px-6 py-4 border-b border-slate-800 bg-slate-900/60 backdrop-blur">
    <h1 class="text-xl font-bold tracking-tight">Ollama <span class="text-emerald-400 font-mono text-sm">Gemma3</span></h1>
    <p class="text-xs text-slate-400">Docker · Node-TS · Vite · Vanilla TS · Tailwind</p>
  </header>

  <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6" id="chat"></main>

  <footer class="px-4 py-4 border-t border-slate-800 bg-slate-900/60 backdrop-blur sticky bottom-0">
    <form id="form" class="flex gap-2 max-w-3xl mx-auto">
      <textarea id="input" rows="1" placeholder="Digite..." class="flex-1 resize-none rounded-xl bg-slate-800 border border-slate-700 px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/40 placeholder:text-slate-500"></textarea>
      <button type="submit" class="rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-3 text-sm font-semibold transition">Enviar</button>
    </form>
  </footer>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
